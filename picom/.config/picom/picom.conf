# Picom configuration for i3 ricing
# Provides rounded corners and subtle shadows

#################################
#          Corners              #
#################################

# Rounded corners radius tuned for the floating bar + launcher look
corner-radius = 18;

# Exclude specific windows from rounded corners
rounded-corners-exclude = [
  "class_g = 'i3bar'",
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Rofi'"
];

#################################
#           Shadows             #
#################################

shadow = true;
shadow-radius = 18;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.35;

# Exclude shadows on some windows
shadow-exclude = [
  "class_g = 'i3bar'",
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#           Fading              #
#################################

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 4;

#################################
#   Transparency / Opacity      #
#################################

inactive-opacity = 0.96;
frame-opacity = 1.0;
inactive-opacity-override = false;
inactive-dim = 0.03;

blur-background = true;
blur-method = "dual_kawase";
blur-strength = 5;

; Exclude specific windows from blur
blur-background-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#       General Settings        #
#################################

# Use glx backend for better performance
backend = "glx";

# Enable vsync
vsync = true;

# Logging
log-level = "warn";

# Use X Sync fence (reduce tearing for nvidia)
xrender-sync-fence = true;

# Apply rounded corners to borders
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# Use damage tracking (reduces CPU usage)
use-damage = true;
