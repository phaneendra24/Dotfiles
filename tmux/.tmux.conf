# Shell and terminal capabilities
set -g default-shell /usr/bin/zsh
set -g default-command ''
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-ghostty:RGB'
set -g prefix C-b

# Scrollback, mouse, and Vim-style navigation
set -g history-limit 1000000
set -g mouse on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi Escape send -X cancel
bind-key -n C-u copy-mode
bind-key -n C-d copy-mode
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Catppuccin Mocha: native top bar without plugins
set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 2
set -g status-style 'bg=default,fg=#cdd6f4'
set -g status-left-length 40
set -g status-right-length 50
set -g status-left '#[fg=#1e1e2e,bg=#a6e3a1,bold]  #[fg=#cdd6f4,bg=#313244,nobold] #S #[default] '
set -g status-right '#[fg=#1e1e2e,bg=#f5c2e7,bold]  #[fg=#cdd6f4,bg=#313244,nobold] #{b:pane_current_path} #[default]'
setw -g window-status-separator ' '
setw -g window-status-format '#[fg=#cdd6f4,bg=#313244] #W #[fg=#1e1e2e,bg=#fab387,bold] #I #[default]'
setw -g window-status-current-format '#[fg=#cdd6f4,bg=#313244] #W #[fg=#1e1e2e,bg=#89b4fa,bold] #I #[default]'
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style 'fg=#cdd6f4,bg=#313244'
setw -g mode-style 'fg=#1e1e2e,bg=#89b4fa'

# Ctrl+B, r reloads this file without restarting sessions.
bind r source-file ~/.tmux.conf \; display-message 'tmux configuration reloaded'
