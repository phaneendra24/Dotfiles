;==========================================================
;
;   STORM FORGE — Developer & Custom Modules
;   Media, Git, Docker, DND, Power Menu
;
;==========================================================

;==========================================================
;                   MEDIA PLAYER
;   Uses playerctl + zscroll for smooth marquee scrolling
;==========================================================

[module/media]
type = custom/script
tail = true
exec = ~/.config/polybar/scripts/scroll_player_status.sh

format = <label>
format-prefix = "󰝚 "
format-prefix-foreground = ${colors.frost}
format-background = ${colors.surface0}
format-padding = 1
label = "%output%"
label-foreground = ${colors.foreground}

click-left = playerctl play-pause
click-right = playerctl next
click-middle = playerctl previous

;==========================================================
;                   GIT STATUS
;   Shows active branch and dirty status for focused terminal
;==========================================================

[module/git]
type = custom/script
exec = ~/.config/polybar/scripts/git-status.sh
interval = 3

format = <label>
format-background = ${colors.surface0}
format-padding = 1
label = "%output%"
label-foreground = ${colors.accent}

click-left = alacritty -e lazygit &

;==========================================================
;                   DOCKER STATUS
;   Shows running container count
;==========================================================

[module/docker]
type = custom/script
exec = ~/.config/polybar/scripts/docker-status.sh
interval = 10

format = <label>
format-background = ${colors.surface0}
format-padding = 1
label = "%output%"

click-left = alacritty -e lazydocker &

;==========================================================
;              DO NOT DISTURB (IPC)
;   Instant toggle — no polling delay.
;   Click toggles dunst notifications on/off.
;==========================================================

[module/dnd]
type = custom/ipc

; hook-0 = Notifications Active
hook-0 = echo "%{F#9ed072}󰂚%{F-}"
; hook-1 = Notifications Muted
hook-1 = echo "%{F#ff6b6b}󰂛%{F-}"

initial = 1

format = <output>
format-background = ${colors.surface0}
format-padding = 1

click-left = ~/.config/polybar/scripts/toggle-dnd.sh

;==========================================================
;                   POWER MENU
;   Rofi-powered session menu: Lock/Logout/Suspend/Reboot/Off
;==========================================================

[module/powermenu]
type = custom/script
exec = echo "󰐥"
interval = 0

format = <label>
format-background = ${colors.surface0}
format-padding = 1
label = "󰐥"
label-foreground = ${colors.secondary}

click-left = ~/.config/polybar/scripts/powermenu.sh
