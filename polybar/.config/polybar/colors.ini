;; ╔══════════════════════════════════════════════════════╗
;; ║           STORM FORGE — Color Palette               ║
;; ╚══════════════════════════════════════════════════════╝
;;
;; Unified dark storm palette for polybar, i3, and alacritty.
;; Deep void background with lightning gold and ember red accents.

[colors]
; Base bar colors (ARGB 90% opacity: #e6101016)
background = #e6101016
background-alt = #f2181622
foreground = #f3e9d2
foreground-alt = #b8ab93
disabled = #65594b

; Accents
primary = #f4d06f
primary-border = #40f4d06f
secondary = #c54f3b
alert = #ff6b6b
warning = #ffb454
success = #9ed072
info = #8fa3b8
accent = #b89acb
frost = #8fbfc1

; Surfaces (Elevated Module Backgrounds)
surface0 = #d91c1824
surface1 = #e6282233
surface2 = #f2382f47
overlay0 = #7e6f5e

; Named colors
ember = #c54f3b
mist = #d6c7ae
steel = #8fa3b8
