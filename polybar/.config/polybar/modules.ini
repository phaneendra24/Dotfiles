;==========================================================
;
;   STORM FORGE — System Modules
;   Hardware, telemetry, workspaces, and system tray
;
;==========================================================

;==========================================================
;                    LEFT MODULES
;==========================================================

[module/logo]
type = custom/script
exec = echo "󰣇"
interval = 0
format = <label>
format-background = ${colors.surface0}
format-padding = 1
label = "󰣇"
label-foreground = ${colors.primary}
click-left = ~/.config/rofi/launchers/type-1/launcher.sh

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true

format = <label-state> <label-mode>

label-mode = " %mode% "
label-mode-background = ${colors.secondary}
label-mode-foreground = ${colors.foreground}

; Focused workspace — Bold Gold badge with dark text
label-focused = " %index% "
label-focused-foreground = #101016
label-focused-background = ${colors.primary}
label-focused-padding = 0

; Unfocused workspaces — Subtle surface
label-unfocused = " %index% "
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-background = ${colors.surface0}
label-unfocused-padding = 0

; Visible on another monitor
label-visible = " %index% "
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.surface1}
label-visible-padding = 0

; Urgent workspace — Alert red
label-urgent = " %index% "
label-urgent-foreground = ${colors.foreground}
label-urgent-background = ${colors.alert}
label-urgent-padding = 0

[module/xwindow]
type = internal/xwindow
format = <label>
format-background = ${colors.surface0}
format-padding = 1
format-prefix = "󰣆 "
format-prefix-foreground = ${colors.primary}
label = "%title:0:36:...%"
label-foreground = ${colors.foreground-alt}
label-empty =

;==========================================================
;                    CENTER MODULES
;==========================================================

[module/date]
type = internal/date
interval = 1

date = "%a %b %d"
time = "%H:%M"

format = <label>
format-background = ${colors.surface0}
format-padding = 2
label = "󰃰 %date%   󰥔 %time%"
label-foreground = ${colors.primary}

;==========================================================
;                    RIGHT MODULES
;==========================================================

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.steel}
format-background = ${colors.surface0}
format-padding = 1
label = "%percentage:2%%"
label-foreground = ${colors.foreground}
warn-percentage = 85
label-warn = "%percentage:2%%"
label-warn-foreground = ${colors.alert}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.mist}
format-background = ${colors.surface0}
format-padding = 1
label = "%percentage_used:2%%"
label-foreground = ${colors.foreground}
warn-percentage = 85
label-warn = "%percentage_used:2%%"
label-warn-foreground = ${colors.alert}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted = <label-mounted>
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.secondary}
format-mounted-background = ${colors.surface0}
format-mounted-padding = 1
label-mounted = "%percentage_used%%"
label-mounted-foreground = ${colors.foreground}

[module/wifi]
type = custom/script
exec = ~/.config/polybar/scripts/wifi-status.sh
interval = 5
format-background = ${colors.surface0}
format-padding = 1
label = "%output%"
label-foreground = ${colors.success}
click-left = nm-connection-editor
click-right = ~/.config/rofi/launchers/type-1/launcher.sh

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <ramp-volume> <label-volume>
format-volume-background = ${colors.surface0}
format-volume-padding = 1
label-volume = "%percentage%%"
label-volume-foreground = ${colors.foreground}

ramp-volume-0 = "󰕿"
ramp-volume-1 = "󰖀"
ramp-volume-2 = "󰕾"
ramp-volume-foreground = ${colors.primary}

format-muted = <label-muted>
format-muted-prefix = "󰝟 "
format-muted-prefix-foreground = ${colors.disabled}
format-muted-background = ${colors.surface0}
format-muted-padding = 1
label-muted = "muted"
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol

[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true

format = <ramp> <label>
format-background = ${colors.surface0}
format-padding = 1
label = "%percentage%%"
label-foreground = ${colors.foreground}

ramp-0 = "󰃞 "
ramp-1 = "󰃟 "
ramp-2 = "󰃠 "
ramp-foreground = ${colors.warning}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 98
low-at = 15

; ── Charging ──
format-charging = <animation-charging> <label-charging>
format-charging-background = ${colors.surface0}
format-charging-padding = 1
label-charging = "%percentage%%"
label-charging-foreground = ${colors.foreground}

; ── Discharging ──
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.surface0}
format-discharging-padding = 1
label-discharging = "%percentage%%"
label-discharging-foreground = ${colors.foreground}

; ── Full ──
format-full = <ramp-capacity> <label-full>
format-full-background = ${colors.surface0}
format-full-padding = 1
label-full = "Full"
label-full-foreground = ${colors.success}

; ── Low Battery ──
format-low = <animation-low> <label-low>
format-low-background = ${colors.surface0}
format-low-padding = 1
label-low = "%percentage%% !"
label-low-foreground = ${colors.alert}

; Battery capacity ramp
ramp-capacity-0 = "󰂎 "
ramp-capacity-1 = "󰁺 "
ramp-capacity-2 = "󰁻 "
ramp-capacity-3 = "󰁼 "
ramp-capacity-4 = "󰁽 "
ramp-capacity-5 = "󰁾 "
ramp-capacity-6 = "󰁿 "
ramp-capacity-7 = "󰂀 "
ramp-capacity-8 = "󰂁 "
ramp-capacity-9 = "󰂂 "
ramp-capacity-10 = "󰁹 "
ramp-capacity-foreground = ${colors.primary}

; Charging animation
animation-charging-0 = "󰢜 "
animation-charging-1 = "󰂆 "
animation-charging-2 = "󰂇 "
animation-charging-3 = "󰂈 "
animation-charging-4 = "󰢝 "
animation-charging-5 = "󰂉 "
animation-charging-6 = "󰢞 "
animation-charging-7 = "󰂊 "
animation-charging-8 = "󰂋 "
animation-charging-9 = "󰂅 "
animation-charging-foreground = ${colors.success}
animation-charging-framerate = 750

; Low battery animation
animation-low-0 = "󰂎 "
animation-low-1 = "󰁺 "
animation-low-foreground = ${colors.alert}
animation-low-framerate = 500

;==========================================================
;                    SYSTEM TRAY MODULE
;   Clean, native Polybar 3.7+ tray module that aligns
;   perfectly with the bar height, background, and padding.
;==========================================================

[module/tray]
type = internal/tray
format = <tray>
format-background = ${colors.surface0}
format-padding = 1
tray-spacing = 6px
tray-size = 16px
tray-background = ${colors.surface0}
