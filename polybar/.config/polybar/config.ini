;
;   Cool Cyber / Sapphire Dark Polybar
;   - Full-width edge-to-edge bar (zero empty right gap)
;   - Modern cool blue / lavender / cyan palette (no yellow/gold)
;   - Sharp, legible SemiBold typography
;
;==========================================================

;==========================================================
;                     COLOR SCHEME
;==========================================================

[colors]
; Base bar colors
background = #ee12131c
background-alt = #1a1b26
foreground = #c0caf5
foreground-alt = #9aa5ce
disabled = #565f89

; Cool Tech Accents (Sapphire, Cyan, Lavender, Mint — Zero Yellow)
primary = #7aa2f7
primary-border = #3d59a1
secondary = #bb9af7
alert = #f7768e
warning = #ff9e64
success = #9ece6a
info = #7dcfff
accent = #b4befe
frost = #89dceb

; Elevated pill surfaces
surface0 = #d91c1d2b
surface1 = #e624283b
surface2 = #f230354f

ember = #f7768e
mist = #cfc9c2
steel = #7aa2f7

;==========================================================
;                      BAR CONFIG
;==========================================================

[bar/main]
monitor = ${env:MONITOR:}

; Full-width bar across the entire display (eliminates the empty right gap)
width = 100%
height = 32pt
offset-x = 0
offset-y = 0
radius = 0

dpi = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0pt
border-bottom-size = 1pt
border-bottom-color = ${colors.primary-border}

padding-left = 2
padding-right = 2
module-margin = 1

; Sharp, legible typography
font-0 = "FiraCode Nerd Font:style=SemiBold:size=10.5;3"
font-1 = "FiraCode Nerd Font:size=11.5;3"
font-2 = "Font Awesome 6 Free:style=Solid:size=10;3"

modules-left = logo i3 xwindow
modules-center = date
modules-right = media git docker cpu memory filesystem wifi pulseaudio backlight battery dnd powermenu tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = i3
override-redirect = false

;==========================================================
;                    LEFT MODULES
;==========================================================

[module/logo]
type = custom/script
exec = echo "󰣇"
interval = 0
format = <label>
format-background = ${colors.surface0}
format-padding = 1
label = "󰣇"
label-foreground = ${colors.info}
click-left = /home/phaneendra/.config/rofi/launchers/type-1/launcher.sh

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true

format = <label-state> <label-mode>

label-mode = " %mode% "
label-mode-background = ${colors.secondary}
label-mode-foreground = ${colors.foreground}

; Focused workspace — Crisp Sapphire Blue pill with dark text
label-focused = " %index% "
label-focused-foreground = #12131c
label-focused-background = ${colors.primary}
label-focused-padding = 0

; Unfocused workspaces — Sleek surface
label-unfocused = " %index% "
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-background = ${colors.surface0}
label-unfocused-padding = 0

; Visible on another monitor
label-visible = " %index% "
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.surface1}
label-visible-padding = 0

; Urgent workspace — Alert coral red
label-urgent = " %index% "
label-urgent-foreground = ${colors.foreground}
label-urgent-background = ${colors.alert}
label-urgent-padding = 0

[module/xwindow]
type = internal/xwindow
format = <label>
format-background = ${colors.surface0}
format-padding = 1
format-prefix = "󰣆 "
format-prefix-foreground = ${colors.primary}
label = "%title:0:36:...%"
label-foreground = ${colors.foreground-alt}
label-empty =

;==========================================================
;                    CENTER MODULES
;==========================================================

[module/date]
type = internal/date
interval = 1

date = "%a %b %d"
time = "%H:%M"

format = <label>
format-background = ${colors.surface0}
format-padding = 2
label = "󰃰 %date%   󰥔 %time%"
label-foreground = ${colors.info}

;==========================================================
;                    RIGHT MODULES
;==========================================================

[module/media]
type = custom/script
tail = true
exec = /home/phaneendra/Dotfiles/polybar/.config/polybar/scripts/scroll_player_status.sh
format = <label>
format-prefix = "󰝚 "
format-prefix-foreground = ${colors.frost}
format-background = ${colors.surface0}
format-padding = 1
label = "%output%"
label-foreground = ${colors.foreground}
click-left = playerctl play-pause
click-right = playerctl next
click-middle = playerctl previous

[module/git]
type = custom/script
exec = /home/phaneendra/Dotfiles/polybar/.config/polybar/scripts/git-status.sh
interval = 3
format = <label>
format-background = ${colors.surface0}
format-padding = 1
label = "%output%"
label-foreground = ${colors.accent}
click-left = ghostty -e lazygit &

[module/docker]
type = custom/script
exec = /home/phaneendra/Dotfiles/polybar/.config/polybar/scripts/docker-status.sh
interval = 10
format = <label>
format-background = ${colors.surface0}
format-padding = 1
label = "%output%"
click-left = ghostty -e lazydocker &

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.primary}
format-background = ${colors.surface0}
format-padding = 1
label = "%percentage:2%%"
label-foreground = ${colors.foreground}
warn-percentage = 85
label-warn = "%percentage:2%%"
label-warn-foreground = ${colors.alert}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.secondary}
format-background = ${colors.surface0}
format-padding = 1
label = "%percentage_used:2%%"
label-foreground = ${colors.foreground}
warn-percentage = 85
label-warn = "%percentage_used:2%%"
label-warn-foreground = ${colors.alert}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted = <label-mounted>
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.info}
format-mounted-background = ${colors.surface0}
format-mounted-padding = 1
label-mounted = "%percentage_used%%"
label-mounted-foreground = ${colors.foreground}

[module/wifi]
type = custom/script
exec = /home/phaneendra/Dotfiles/polybar/.config/polybar/scripts/wifi-status.sh
interval = 5
format-background = ${colors.surface0}
format-padding = 1
label = "%output%"
label-foreground = ${colors.success}
click-left = nm-connection-editor
click-right = /home/phaneendra/.config/rofi/launchers/type-1/launcher.sh

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <ramp-volume> <label-volume>
format-volume-background = ${colors.surface0}
format-volume-padding = 1
label-volume = "%percentage%%"
label-volume-foreground = ${colors.foreground}

ramp-volume-0 = "󰕿"
ramp-volume-1 = "󰖀"
ramp-volume-2 = "󰕾"
ramp-volume-foreground = ${colors.info}

format-muted = <label-muted>
format-muted-prefix = "󰝟 "
format-muted-prefix-foreground = ${colors.disabled}
format-muted-background = ${colors.surface0}
format-muted-padding = 1
label-muted = "muted"
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol

[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true

format = <ramp> <label>
format-background = ${colors.surface0}
format-padding = 1
label = "%percentage%%"
label-foreground = ${colors.foreground}

ramp-0 = "󰃞 "
ramp-1 = "󰃟 "
ramp-2 = "󰃠 "
ramp-foreground = ${colors.secondary}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 98
low-at = 15

format-charging = <animation-charging> <label-charging>
format-charging-background = ${colors.surface0}
format-charging-padding = 1
label-charging = "%percentage%%"
label-charging-foreground = ${colors.foreground}

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.surface0}
format-discharging-padding = 1
label-discharging = "%percentage%%"
label-discharging-foreground = ${colors.foreground}

format-full = <ramp-capacity> <label-full>
format-full-background = ${colors.surface0}
format-full-padding = 1
label-full = "Full"
label-full-foreground = ${colors.success}

format-low = <animation-low> <label-low>
format-low-background = ${colors.surface0}
format-low-padding = 1
label-low = "%percentage%% !"
label-low-foreground = ${colors.alert}

ramp-capacity-0 = "󰂎 "
ramp-capacity-1 = "󰁺 "
ramp-capacity-2 = "󰁻 "
ramp-capacity-3 = "󰁼 "
ramp-capacity-4 = "󰁽 "
ramp-capacity-5 = "󰁾 "
ramp-capacity-6 = "󰁿 "
ramp-capacity-7 = "󰂀 "
ramp-capacity-8 = "󰂁 "
ramp-capacity-9 = "󰂂 "
ramp-capacity-10 = "󰁹 "
ramp-capacity-foreground = ${colors.primary}

animation-charging-0 = "󰢜 "
animation-charging-1 = "󰂆 "
animation-charging-2 = "󰂇 "
animation-charging-3 = "󰂈 "
animation-charging-4 = "󰢝 "
animation-charging-5 = "󰂉 "
animation-charging-6 = "󰢞 "
animation-charging-7 = "󰂊 "
animation-charging-8 = "󰂋 "
animation-charging-9 = "󰂅 "
animation-charging-foreground = ${colors.success}
animation-charging-framerate = 750

animation-low-0 = "󰂎 "
animation-low-1 = "󰁺 "
animation-low-foreground = ${colors.alert}
animation-low-framerate = 500

[module/dnd]
type = custom/ipc
hook-0 = echo "%{F#9ece6a}󰂚%{F-}"
hook-1 = echo "%{F#f7768e}󰂛%{F-}"
initial = 1
format = <output>
format-background = ${colors.surface0}
format-padding = 1
click-left = /home/phaneendra/Dotfiles/polybar/.config/polybar/scripts/toggle-dnd.sh

[module/powermenu]
type = custom/script
exec = echo "󰐥"
interval = 0
format = <label>
format-background = ${colors.surface0}
format-padding = 1
label = "󰐥"
label-foreground = ${colors.alert}
click-left = /home/phaneendra/Dotfiles/polybar/.config/polybar/scripts/powermenu.sh

[module/tray]
type = internal/tray
format = <tray>
format-background = ${colors.surface0}
format-padding = 1
tray-spacing = 6px
tray-size = 16px
tray-background = ${colors.surface0}

;==========================================================
;                   GLOBAL SETTINGS
;==========================================================

[settings]
screenchange-reload = true
pseudo-transparency = false

[global/wm]
margin-top = 0
margin-bottom = 0
