;
;   Anime storm-inspired Polybar Config
;
;==========================================================

;==========================================================
;                     COLOR SCHEME
;            Dark storm palette with lightning accents
;==========================================================

[colors]
background = #00000000
background-alt = #d9101016
foreground = #f3e9d2
foreground-alt = #b8ab93

primary = #f4d06f
secondary = #c54f3b
alert = #ff6b6b
warning = #ffb454
success = #9ed072

surface0 = #cc121217
surface1 = #dd1b1820
surface2 = #ee27212b
overlay0 = #7e6f5e
ember = #8f2f24
mist = #d6c7ae
steel = #8fa3b8

;==========================================================
;                      BAR CONFIG
;==========================================================

[bar/main]
monitor = ${env:MONITOR:}
width = 98%
height = 34pt
offset-x = 1%
offset-y = 8
radius = 16

dpi = 0

background = ${colors.background-alt}
foreground = ${colors.foreground}

line-size = 0pt

border-size = 1pt
border-color = #55f4d06f

padding-left = 1
padding-right = 1

module-margin = 1

separator =
separator-foreground = ${colors.surface1}

font-0 = "FiraCode Nerd Font:size=11;2"
font-1 = "FiraCode Nerd Font:size=13;3"
font-2 = "Font Awesome 6 Free:style=Solid:size=11;2"

modules-left = i3 xwindow
modules-center = date
modules-right = cpu memory filesystem wifi pulseaudio backlight battery

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

tray-position = right
tray-padding = 4
tray-background = ${colors.surface0}

wm-restack = i3
override-redirect = false

;==========================================================
;                     LEFT MODULES
;==========================================================

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true

label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${colors.secondary}
label-mode-foreground = ${colors.foreground}

label-focused = %index%
label-focused-foreground = #111016
label-focused-background = ${colors.primary}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-background = ${colors.surface0}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.surface1}
label-visible-padding = 2

label-urgent = %index%
label-urgent-foreground = ${colors.foreground}
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
format-background = ${colors.surface0}
format-padding = 2
label = 󰣆 %title:0:45:...%
label-foreground = ${colors.foreground-alt}

;==========================================================
;                    CENTER MODULES
;==========================================================

[module/date]
type = internal/date
interval = 1

date = %a %b %d
time = %H:%M:%S

format-background = ${colors.surface1}
format-padding = 2
label = 󰃰 %date%  󰥔 %time%
label-foreground = ${colors.primary}

;==========================================================
;                    RIGHT MODULES
;==========================================================

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-background = ${colors.surface0}
format-padding = 2
label = 󰻠 %percentage:2%%
warn-percentage = 80
label-foreground = ${colors.steel}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-background = ${colors.surface0}
format-padding = 2
label = 󰍛 %percentage_used:2%%
warn-percentage = 80
label-foreground = ${colors.mist}

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

format-mounted = <label-mounted>
format-mounted-background = ${colors.surface0}
format-mounted-padding = 2
label-mounted = 󰋊 %percentage_used%%
label-mounted-foreground = ${colors.secondary}

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.foreground-alt}

[module/wifi]
type = custom/script
exec = /home/phaneendra/Dotfiles/polybar/.config/polybar/wifi-status.sh
interval = 5
format-background = ${colors.surface0}
format-padding = 2
label = %output%
label-foreground = ${colors.success}
click-left = nm-connection-editor
click-right = rofi -show drun

[module/network-wired]
type = internal/network
interface-type = wired
interval = 3.0

format-connected = <label-connected>
format-connected-background = ${colors.surface0}
format-connected-padding = 2
label-connected = 󰈀 %local_ip%
label-connected-foreground = ${colors.success}

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.surface0}
format-disconnected-padding = 2
label-disconnected = 󰈀 Disconnected
label-disconnected-foreground = ${colors.foreground-alt}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
format-volume-background = ${colors.surface0}
format-volume-padding = 2
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

format-muted = <label-muted>
format-muted-background = ${colors.surface0}
format-muted-padding = 2
label-muted = 󰝟 muted
label-muted-foreground = ${colors.foreground-alt}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.primary}

click-right = pavucontrol

[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true

format = <ramp> <label>
format-background = ${colors.surface0}
format-padding = 2
label = %percentage%%
label-foreground = ${colors.foreground}

ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
ramp-foreground = ${colors.warning}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 98
low-at = 15

format-charging = <animation-charging> <label-charging>
format-charging-background = ${colors.surface0}
format-charging-padding = 2
format-charging-foreground = ${colors.success}
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.surface0}
format-discharging-padding = 2
label-discharging = %percentage%%
label-discharging-foreground = ${colors.foreground}

format-full = <ramp-capacity> <label-full>
format-full-background = ${colors.surface0}
format-full-padding = 2
format-full-foreground = ${colors.success}
label-full = Full

format-low = <animation-low> <label-low>
format-low-background = ${colors.surface0}
format-low-padding = 2
format-low-foreground = ${colors.alert}
label-low = %percentage%% LOW!

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹
ramp-capacity-foreground = ${colors.primary}

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-5 = 󰂉
animation-charging-6 = 󰢞
animation-charging-7 = 󰂊
animation-charging-8 = 󰂋
animation-charging-9 = 󰂅
animation-charging-framerate = 750

animation-low-0 = 󰂎
animation-low-1 = 󰁺
animation-low-framerate = 500

;==========================================================
;                   GLOBAL WM SETTINGS
;==========================================================

[settings]
screenchange-reload = true
pseudo-transparency = true

[global/wm]
margin-top = 0
margin-bottom = 0
