# alacritty.toml


# Storm-themed config aligned with the desktop palette.


# Features: No title bar, blur, and storm palette.
 
[window]


# Remove the title bar and borders


decorations = "none"
 
# Window padding


padding = { x = 18, y = 18 }
 
# Background opacity (0.0 to 1.0)
opacity = 0.9
 
# Enable blur for a 'frosted glass' effect


# NOTE: This requires a compositor that supports blurring on your OS


# (e.g., KWin on Linux, Hyprland, or macOS). May not work on all systems.


blur = true
 
# Startup mode (Windowed, Maximized, Fullscreen)


startup_mode = "Windowed"
 
 
[scrolling]


history = 10000


multiplier = 3
 
 
[font]


# Font configuration is set to Fira Code.


normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }

bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }

italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

# Font size reverted back to 13.0


size = 13.0
 
 
[cursor]


# Cursor style: Block, Beam, Underline


style = { shape = "Block", blinking = "On" }
 
# Makes cursor hollow when window is not focused


unfocused_hollow = true
 
 
# Storm palette


[colors]


# Default colors

primary = { background = "#101016", foreground = "#f3e9d2" }
 
# Cursor colors

cursor = { text = "#101016", cursor = "#f4d06f" }
vi_mode_cursor = { text = "#101016", cursor = "#c54f3b" }
 
# Search colors

search = { matches = { foreground = "#101016", background = "#9ed072" }, focused_match = { foreground = "#101016", background = "#f4d06f" } }
 
# Normal colors

normal = { black = "#18181f", red = "#c54f3b", green = "#9ed072", yellow = "#f4d06f", blue = "#8fa3b8", magenta = "#b89acb", cyan = "#8fbfc1", white = "#d6c7ae" }
 
# Bright colors

bright = { black = "#27212b", red = "#ff6b6b", green = "#b4db8b", yellow = "#ffd978", blue = "#a7bacd", magenta = "#c8acd8", cyan = "#a4d4d5", white = "#f3e9d2" }
 
 
# Key bindings


[keyboard]


bindings = [


    # (macOS) Copy


    { key = "C", mods = "Command", action = "Copy" },


    # (macOS) Paste


    { key = "V", mods = "Command", action = "Paste" },


    # (Windows/Linux) Copy


    { key = "C", mods = "Control|Shift", action = "Copy" },


    # (Windows/Linux) Paste


    { key = "V", mods = "Control|Shift", action = "Paste" },


]
 
