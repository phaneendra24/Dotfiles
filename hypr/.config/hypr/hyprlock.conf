# ╔══════════════════════════════════════════════════════════════════╗
# ║  Hyprlock — Lock Screen Config                                  ║
# ║  Theme: Tokyo Night · Glassmorphism                             ║
# ╚══════════════════════════════════════════════════════════════════╝

general {
    grace = 5              # seconds before locking after idle (lets you jiggle mouse to cancel)
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
}

# ── Background ──
background {
    monitor =
    path = screenshot       # blur a screenshot of your current desktop
    blur_passes = 3
    blur_size = 6
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.15
    vibrancy_darkness = 0.1
}

# ── Clock ──
label {
    monitor =
    text = $TIME
    color = rgba(125, 207, 255, 1.0)
    font_size = 72
    font_family = FiraCode Nerd Font
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Date ──
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    color = rgba(192, 202, 245, 0.8)
    font_size = 18
    font_family = FiraCode Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# ── Greeting ──
label {
    monitor =
    text = Hi, $USER
    color = rgba(187, 154, 247, 0.9)
    font_size = 16
    font_family = FiraCode Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

# ── Password Input ──
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(122, 162, 247, 0.4)
    inner_color = rgba(15, 15, 25, 0.6)
    font_color = rgb(192, 202, 245)
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span foreground="##9aa5ce">  Enter Password...</span>
    hide_input = false
    rounding = 12
    check_color = rgba(158, 206, 106, 0.6)
    fail_color = rgba(247, 118, 142, 0.6)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = rgba(224, 175, 104, 0.6)
    position = 0, -120
    halign = center
    valign = center
}
