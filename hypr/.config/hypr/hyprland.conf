# #######################################################################################
# STORM FORGE HYPRLAND CONFIGURATION
# Tailored from i3wm — Preserving 100% Muscle Memory & Workflows
# #######################################################################################

# ####################
# ### MONITORS ###
# ####################
# Syntax: monitor = name, resolution@refresh, position, scale
# Your primary display is eDP-1 (2560x1600).
# Recommended scales:
#   1.25 -> Compact, high screen real estate
#   1.33 -> Balanced, comfortable viewing (Default)
#   1.50 -> Larger text and UI elements
monitor = eDP-1, 2560x1600@60, 0x0, 1.33
monitor = , preferred, auto, 1


# ####################
# ### MY PROGRAMS ###
# ####################
# See https://wiki.hyprland.org/Configuring/Keywords/
$terminal    = alacritty
$fileManager = thunar
$menu        = /home/phaneendra/.config/rofi/launchers/type-1/launcher.sh
$lock        = hyprlock


# #################
# ### AUTOSTART ###
# #################
# Autostart necessary processes (daemons, status bar, applets)
exec-once = waybar &
exec-once = dunst &
exec-once = nm-applet --indicator &
exec-once = wl-paste --type text --watch cliphist store 2>/dev/null &
exec-once = wl-paste --type image --watch cliphist store 2>/dev/null &


# #############################
# ### ENVIRONMENT VARIABLES ###
# #############################
# Ensures Wayland-native rendering and smooth cursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


# #####################
# ### LOOK AND FEEL ###
# #####################
# Replaces Picom — Native GPU-accelerated styling & animations

general {
    # Gaps configuration (mirrors i3 gaps: inner 4, outer 8)
    gaps_in  = 4
    gaps_out = 8

    border_size = 1

    # Cool Sapphire & Lavender borders (no harsh yellow/gold)
    col.active_border   = rgb(7aa2f7) rgb(bb9af7) 45deg
    col.inactive_border = rgb(27212b)

    # Allow dragging window borders to resize
    resize_on_border = true

    # Dwindle is the default dynamic tiling layout
    layout = dwindle
}

decoration {
    rounding = 12

    # Opacity
    active_opacity   = 1.0
    inactive_opacity = 0.96

    # Native Shadows
    shadow {
        enabled      = true
        range        = 14
        render_power = 3
        color        = rgba(0c101666)
    }

    # Native Dual-Kawase Style Blur
    blur {
        enabled   = true
        size      = 5
        passes    = 2
        vibrancy  = 0.1696
        new_optimizations = true
    }
}

# Smooth window animations
animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows,     1, 3.5, easeOutQuint
    animation = windowsIn,   1, 3.5, easeOutQuint, popin 87%
    animation = windowsOut,  1, 3.5, easeInOutCubic, popin 87%
    animation = fadeIn,      1, 2.5, easeOutQuint
    animation = fadeOut,     1, 2.5, easeInOutCubic
    animation = workspaces,  1, 4.0, easeOutQuint, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

xwayland {
    force_zero_scaling = true
}


# #############
# ### INPUT ###
# #############
# Touchpad & Mouse configuration (translates lines 352-370 from i3)
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0.4 # Preserves your 0.4 mouse/touchpad speed

    touchpad {
        natural_scroll = true # Natural scrolling enabled
        tap-to-click   = true # Tap to click enabled
        scroll_factor  = 0.5
    }
}

# 3-finger swipe to switch workspaces
gesture = 3, horizontal, workspace

# #############
# ### BINDS ###
# #############
# Auto back-and-forth workspace switching (like i3 workspace_auto_back_and_forth)
binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
}


# ####################
# ### KEYBINDINGS  ###
# ####################
# 100% compatible with your i3wm muscle memory
$mainMod = SUPER

# ── Core Applications ──
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D,      exec, $menu
bind = $mainMod, grave,  exec, google-chrome
bind = $mainMod, Q,      exec, $lock

# ── Window Closing ──
# Both i3 habits: $mod+W and $mod+Shift+Q
bind = $mainMod,       W, killactive,
bind = $mainMod SHIFT, Q, killactive,

# ── Window Layout & State ──
bind = $mainMod,       F,     fullscreen, 0
bind = $mainMod SHIFT, space, togglefloating,
bind = $mainMod,       space, cyclenext,
bind = $mainMod,       Tab,   workspace, previous # Replaces workspace_auto_back_and_forth
bind = $mainMod,       E,     togglesplit,        # Dwindle split toggle (horizontal/vertical)

# ── Focus Navigation (Vim style: $mod + H/J/K/L) ──
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# ── Focus Navigation (Arrow keys: $mod + Left/Down/Up/Right) ──
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# ── Move Window (Vim style: $mod + Shift + H/J/K/L) ──
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# ── Move Window (Arrow keys: $mod + Shift + Left/Down/Up/Right) ──
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# ── Workspaces (Switch: $mod + 1..0) ──
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ── Move Container to Workspace ($mod + Shift + 1..0) ──
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── Special Workspace / Scratchpad ──
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ── Reload Config (like i3's $mod+Shift+r) ──
bind = $mainMod SHIFT, R, exec, hyprctl reload && notify-send "Hyprland" "Config reloaded ✓"

# ── Screenshot (Wayland replacement for flameshot) ──
# Select area with slurp, capture with grim, copy to clipboard & send notification
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Saved to clipboard!"

# ── Media & Volume Controls (PipeWire / PulseAudio) ──
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+ || pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- || pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle || pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle || pactl set-source-mute @DEFAULT_SOURCE@ toggle

# ── Screen Brightness Controls ──
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# ── Media Player Controls (playerctl) ──
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous

# ── Notification Controls (Dunst) ──
bind = $mainMod,       comma, exec, dunstctl close
bind = $mainMod SHIFT, comma, exec, dunstctl close-all
bind = $mainMod SHIFT, M,     exec, dunstctl history-pop

# ── Mouse Drag & Resize ──
# Hold $mod and left click to drag; hold $mod and right click to resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# ###############################
# ### WINDOWS AND WORKSPACES  ###
# ###############################
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = float-dialogs
    match:class = pavucontrol|nm-connection-editor|blueman-manager
    float = true
}

windowrule {
    name = float-popups
    match:title = Clipboard Manager|Picture-in-Picture
    float = true
}
