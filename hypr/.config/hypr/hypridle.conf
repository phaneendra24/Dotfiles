# ╔══════════════════════════════════════════════════════════════════╗
# ║  Hypridle — Idle Management Daemon                               ║
# ║  Saves laptop battery, dims screen, and locks safely             ║
# ╚══════════════════════════════════════════════════════════════════╝

general {
    lock_cmd = pidof hyprlock || hyprlock          # command to lock screen
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on     # turn on display when resumed
}

# ── 1. Dim backlight after 2.5 mins (150s) ──
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10           # save brightness & dim to 10%
    on-resume = brightnessctl -r                   # restore previous brightness
}

# ── 2. Lock screen after 5 mins (300s) ──
listener {
    timeout = 300
    on-timeout = loginctl lock-session             # triggers lock_cmd (hyprlock)
}

# ── 3. Turn display off after 5.5 mins (330s) ──
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off         # turn screen off
    on-resume = hyprctl dispatch dpms on           # turn screen on when activity detected
}

# ── 4. Suspend laptop after 20 mins (1200s) ──
listener {
    timeout = 1200
    on-timeout = systemctl suspend                 # suspend laptop
}
